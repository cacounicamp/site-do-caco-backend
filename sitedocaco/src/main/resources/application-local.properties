spring.application.name=sitedocaco
server.port=8080

# App:
app.frontend.url=
server.servlet.context-path=/api

# Database
# Caminho do arquivo do banco. O arquivo será criado automaticamente se não existir.
# O prefixo ./data/ criará a pasta "data" na raiz do projeto.
spring.datasource.url=jdbc:sqlite:sitedocaco/data/sqlite.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto do Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true

# ===== WireMock OAuth2 (mock local) =====
wiremock.oauth2.port=9988

# Provider OAuth2 apontando para o WireMock — SEM issuer-uri para evitar
# a chamada de discovery na startup.
spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:9988/oauth2/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost:9988/oauth2/token
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost:9988/userinfo
spring.security.oauth2.client.provider.google.user-info-authentication-method=header
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Valores dummy, o WireMock não se importa com eles
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Site do CACo (Local)

# JWT
jwt.secret=
# 7 dias em milissegundos
jwt.expiration=604800000

# ImgBB
imgbb.api.key=
imgbb.api.url=https://api.imgbb.com/1/upload

# Upload Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.enabled=true
server.tomcat.max-part-count=13

# Timeouts (importante para uploads grandes)
server.servlet.connection-timeout=30s
spring.mvc.async.request-timeout=30s


# Mostra o porquê real de cada falha de bean.
#logging.level.org.springframework.beans=DEBUG
#logging.level.org.springframework.boot.autoconfigure=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web.client=DEBUG

# Ativa o relatório de condições do Spring Boot (equivalente a --debug).
#debug=true